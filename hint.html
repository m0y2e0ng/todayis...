<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<title>today is...</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link id="favicon" rel="icon" type="image/svg+xml" href="">
	<link rel="stylesheet" href="style.css?v=23">
</head>
<body>
	<!--
		숫자 없는 달력 — 힌트 버전 (예시)
		- 기본: 원 하나(1일)부터 시작해서 누를 때마다 하루씩 쌓임
		- hint.html?start=random : 이번 달의 아무 날에서 시작
		- 날짜 숫자는 보여주지 않고, 실제 오늘과의 거리만 말로 힌트를 줌
	-->
	<div id="app-container">
		<div class="day-nav">
			<div id="hint" class="today-title">today is...</div>
		</div>
		<div id="circle-container">
			<div id="main-circle" class="circle-wrapper"></div>
		</div>
		<div id="bottom-container">
			<div id="done-button" class="day-link done-button">done!</div>
		</div>
	</div>

	<script>
		function getDaysInMonth(year, month) {
			return new Date(year, month + 1, 0).getDate();
		}

		// 항상 실제 이번 달 기준
		const now = new Date();
		const YEAR = now.getFullYear();
		const MONTH = now.getMonth();
		const TODAY = now.getDate();
		const totalDays = getDaysInMonth(YEAR, MONTH);

		// 시작일: 기본은 1일, ?start=random 이면 이번 달 아무 날
		const startMode = new URLSearchParams(location.search).get('start');
		function pickStartDay() {
			return startMode === 'random' ? 1 + Math.floor(Math.random() * totalDays) : 1;
		}
		let currentDay = pickStartDay();

		// 월 페이지와 같은 색 (같은 연도/월이면 항상 같은 순서)
		const vibrantColors = [
			'#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#00C7BE', '#30B0C7',
			'#007AFF', '#5856D6', '#AF52DE', '#FF2D55', '#FF6B6B', '#4ECDC4',
			'#45B7D1', '#96CEB4', '#FFEEAD', '#D4A5A5', '#9B5DE5', '#F15BB5',
			'#FEE440', '#00BBF9', '#00F5D4', '#E63946', '#F4A261', '#2A9D8F',
			'#E76F51', '#457B9D', '#F72585', '#7209B7', '#3A0CA3', '#4361EE',
			'#4CC9F0', '#06D6A0', '#118AB2', '#EF476F', '#FFD166', '#05D550',
			'#8338EC', '#3A86FF', '#FB5607', '#FF006E', '#38B000', '#70E000'
		];

		function mulberry32(a) {
			return function() {
				let t = a += 0x6D2B79F5;
				t = Math.imul(t ^ t >>> 15, t | 1);
				t ^= t + Math.imul(t ^ t >>> 7, t | 61);
				return ((t ^ t >>> 14) >>> 0) / 4294967296;
			};
		}

		function getMonthColors(year, month) {
			const rng = mulberry32(year * 10000 + (month + 1) * 37 + 1024);
			const list = [];
			let last = '';
			for (let d = 0; d < getDaysInMonth(year, month); d++) {
				let c;
				do { c = vibrantColors[Math.floor(rng() * vibrantColors.length)]; } while (c === last);
				list.push(c);
				last = c;
			}
			return list;
		}

		const colors = getMonthColors(YEAR, MONTH);
		const nextColors = getMonthColors(MONTH === 11 ? YEAR + 1 : YEAR, (MONTH + 1) % 12);

		// 실제 오늘과의 거리 → 숫자 없는 힌트
		function hintFor(day) {
			const diff = day - TODAY;
			if (diff === 0) return 'today is...';
			if (diff === 1) return 'tomorrow is...';
			if (diff === -1) return 'yesterday was...';
			if (diff === 2) return 'the day after tomorrow is...';
			if (diff === -2) return 'the day before yesterday was...';
			if (diff > 0 && diff <= 7) return 'soon is...';
			if (diff < 0 && diff >= -7) return 'recently was...';
			return diff > 0 ? 'someday is...' : 'long ago was...';
		}

		const circleWrapper = document.getElementById('main-circle');
		const hint = document.getElementById('hint');
		const doneButton = document.getElementById('done-button');

		// done! 색: 이 달 첫 원 색 / 호버 시 다음 달 첫 원 색
		doneButton.style.setProperty('--done-color', colors[0]);
		doneButton.style.setProperty('--done-hover', nextColors[0]);

		function circlesSvg(upTo, size) {
			const step = size / 2 / totalDays;
			let s = '';
			for (let d = 1; d <= upTo; d++) {
				s += `<circle cx="${size / 2}" cy="${size / 2}" r="${size / 2 - step * (d - 1)}" fill="${colors[d - 1]}"/>`;
			}
			return s;
		}

		// 탭 아이콘: 이번 달 완성 형태
		document.getElementById('favicon').href =
			'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${circlesSvg(totalDays, 100)}</svg>`);

		function render() {
			circleWrapper.innerHTML =
				`<svg viewBox="0 0 1000 1000" style="width:100%;height:100%">${circlesSvg(currentDay, 1000)}</svg>`;
			hint.textContent = hintFor(currentDay);
			doneButton.classList.toggle('visible', currentDay === totalDays);
		}

		// 원 누르기 → 하루씩 쌓임 (끝까지 쌓이면 더 쌓이지 않음)
		document.getElementById('circle-container').addEventListener('click', () => {
			if (currentDay < totalDays) {
				currentDay++;
				render();
			}
		});

		// done! → 처음부터 다시
		doneButton.addEventListener('click', () => {
			currentDay = pickStartDay();
			render();
		});

		render();
	</script>
</body>
</html>
