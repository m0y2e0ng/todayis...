<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<title>Calendar — Jul 2026</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%234361EE'/></svg>">
	<link rel="stylesheet" href="style.css?v=23">
</head>
<body>
	<div id="app-container">
		<div class="day-nav">
			<div id="nav-today" class="today-title day-link">today is...</div>
			<div id="nav-tomorrow" class="day-link">tomorrow is...</div>
			<div id="nav-yesterday" class="day-link">yesterday is...</div>
			<div id="nav-next-month" class="day-link">next month is...</div>
			<div id="nav-last-month" class="day-link">last month is...</div>
		</div>
		<div id="circle-container">
			<div id="main-circle" class="circle-wrapper"></div>
		</div>
		<div id="bottom-container">
			<div id="date-display" class="date-display"></div>
			<div id="done-button" class="day-link done-button">done!</div>
		</div>
	</div>

	<script>
		// 이 파일의 달: Jul 2026
		const FIXED_YEAR = 2026;
		const FIXED_MONTH = 6; // 0-indexed (Jan=0 ... Dec=11)

		function getDaysInMonth(year, month) {
			return new Date(year, month + 1, 0).getDate();
		}

		// 현재 실제 날짜와 비교해서 오늘 날짜로 시작할지 1일로 시작할지 결정
		const realNow = new Date();
		const isCurrentMonth = (realNow.getFullYear() === FIXED_YEAR && realNow.getMonth() === FIXED_MONTH);

		let currentYear = FIXED_YEAR;
		let currentMonth = FIXED_MONTH;
		let totalDays = getDaysInMonth(currentYear, currentMonth);
		// 주소 끝 #일자 로 시작일 지정 가능 (예: nov.html#1)
		const hashDay = parseInt(location.hash.slice(1), 10);
		let currentDay = (hashDay >= 1 && hashDay <= totalDays) ? hashDay : (isCurrentMonth ? realNow.getDate() : 1);

		// 알록달록 비비드 컬러 팔레트
		const vibrantColors = [
			'#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#00C7BE', '#30B0C7',
			'#007AFF', '#5856D6', '#AF52DE', '#FF2D55', '#FF6B6B', '#4ECDC4',
			'#45B7D1', '#96CEB4', '#FFEEAD', '#D4A5A5', '#9B5DE5', '#F15BB5',
			'#FEE440', '#00BBF9', '#00F5D4', '#E63946', '#F4A261', '#2A9D8F',
			'#E76F51', '#457B9D', '#F72585', '#7209B7', '#3A0CA3', '#4361EE',
			'#4CC9F0', '#06D6A0', '#118AB2', '#EF476F', '#FFD166', '#05D550',
			'#8338EC', '#3A86FF', '#FB5607', '#FF006E', '#38B000', '#70E000'
		];

		// Mulberry32 PRNG — 같은 연도/월이면 항상 동일한 색상 순서
		function mulberry32(a) {
			return function() {
				let t = a += 0x6D2B79F5;
				t = Math.imul(t ^ t >>> 15, t | 1);
				t ^= t + Math.imul(t ^ t >>> 7, t | 61);
				return ((t ^ t >>> 14) >>> 0) / 4294967296;
			};
		}

		// 1년 12달 색상 테이블 고정 생성 & localStorage 보존
		function getYearCalendarColors(year) {
			const storageKey = `calendar_year_colors_${year}`;
			try {
				const saved = localStorage.getItem(storageKey);
				if (saved) {
					const parsed = JSON.parse(saved);
					if (Array.isArray(parsed) && parsed.length === 12) return parsed;
				}
			} catch(e) {}

			const yearColors = [];
			for (let m = 0; m < 12; m++) {
				const days = getDaysInMonth(year, m);
				const seed = year * 10000 + (m + 1) * 37 + 1024;
				const rng = mulberry32(seed);
				const list = [];
				let last = '';
				for (let d = 0; d < days; d++) {
					let c;
					do { c = vibrantColors[Math.floor(rng() * vibrantColors.length)]; } while (c === last);
					list.push(c);
					last = c;
				}
				yearColors.push(list);
			}
			try { localStorage.setItem(storageKey, JSON.stringify(yearColors)); } catch(e) {}
			return yearColors;
		}

		let yearColors = getYearCalendarColors(currentYear);
		let colors = yearColors[currentMonth];

		const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
		const months   = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

		function formatDate(dayNum) {
			const d = new Date(currentYear, currentMonth, dayNum);
			return `${weekdays[d.getDay()]}, ${months[currentMonth]} ${dayNum}`;
		}

		const circleWrapper    = document.getElementById('main-circle');
		const dateDisplay      = document.getElementById('date-display');

		function render() {
			// 원 그리기
			circleWrapper.innerHTML = '';
			const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
			svg.setAttribute('viewBox', '0 0 1000 1000');
			svg.style.width = '100%';
			svg.style.height = '100%';

			const R = 500;
			const step = R / totalDays;
			for (let d = 1; d <= currentDay; d++) {
				const r = R - step * (d - 1);
				if (r <= 0) break;
				const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
				circle.setAttribute('cx', '500');
				circle.setAttribute('cy', '500');
				circle.setAttribute('r', r);
				circle.setAttribute('fill', colors[d - 1]);
				svg.appendChild(circle);
			}
			circleWrapper.appendChild(svg);

			// 날짜 텍스트
			dateDisplay.textContent = formatDate(currentDay);

			// 마지막 날까지 다 채우면 done! 노출
			document.getElementById('done-button').classList.toggle('visible', currentDay === totalDays);

		}

		// 원 클릭 → 다음 날짜
		document.getElementById('circle-container').addEventListener('click', () => {
			currentDay = currentDay < totalDays ? currentDay + 1 : 1;
			render();
		});

		const monthFiles = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

		// today is → 오늘로 이동 (오늘이 다른 달이면 그 달 파일로 이동)
		function goToday() {
			const now = new Date();
			if (now.getFullYear() === FIXED_YEAR && now.getMonth() === FIXED_MONTH) {
				currentDay = now.getDate();
				render();
			} else {
				location.href = `${monthFiles[now.getMonth()]}.html#${now.getDate()}`;
			}
		}

		// tomorrow is → 내일 (마지막 날이면 다음 달 1일을 새 탭으로)
		function goTomorrow() {
			if (currentDay < totalDays) {
				currentDay++;
				render();
			} else {
				window.open(`${monthFiles[(FIXED_MONTH + 1) % 12]}.html#1`, '_blank');
			}
		}

		// yesterday is → 어제 (1일이면 이전 달 마지막 날을 새 탭으로)
		function goYesterday() {
			if (currentDay > 1) {
				currentDay--;
				render();
			} else {
				const prevM = (FIXED_MONTH + 11) % 12;
				window.open(`${monthFiles[prevM]}.html#${getDaysInMonth(FIXED_YEAR, prevM)}`, '_blank');
			}
		}

		document.getElementById('nav-today').addEventListener('click', goToday);
		document.getElementById('nav-tomorrow').addEventListener('click', goTomorrow);
		document.getElementById('nav-yesterday').addEventListener('click', goYesterday);

		// next month is → 다음 달 1일을 새 탭으로
		document.getElementById('nav-next-month').addEventListener('click', () => {
			window.open(`${monthFiles[(FIXED_MONTH + 1) % 12]}.html#1`, '_blank');
		});

		// done! 색: 이 달 첫 원 색 / 호버 시 다음 달 첫 원 색
		const doneButton = document.getElementById('done-button');
		doneButton.style.setProperty('--done-color', yearColors[FIXED_MONTH][0]);
		doneButton.style.setProperty('--done-hover', yearColors[(FIXED_MONTH + 1) % 12][0]);

		// done! → 다음 달 1일을 새 탭으로
		doneButton.addEventListener('click', () => {
			window.open(`${monthFiles[(FIXED_MONTH + 1) % 12]}.html#1`, '_blank');
		});

		// last month is → 이전 달 1일을 새 탭으로
		document.getElementById('nav-last-month').addEventListener('click', () => {
			window.open(`${monthFiles[(FIXED_MONTH + 11) % 12]}.html#1`, '_blank');
		});

		// 날짜 텍스트 클릭 → 오늘로 이동
		dateDisplay.style.cursor = 'pointer';
		dateDisplay.addEventListener('click', goToday);

		render();
	</script>
</body>
</html>
