<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<title>Calendar — Jul 2026</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50.000' fill='%234361EE'/><circle cx='50' cy='50' r='48.387' fill='%23F15BB5'/><circle cx='50' cy='50' r='46.774' fill='%23FF9500'/><circle cx='50' cy='50' r='45.161' fill='%2345B7D1'/><circle cx='50' cy='50' r='43.548' fill='%2334C759'/><circle cx='50' cy='50' r='41.935' fill='%2300BBF9'/><circle cx='50' cy='50' r='40.323' fill='%235856D6'/><circle cx='50' cy='50' r='38.710' fill='%23FFCC00'/><circle cx='50' cy='50' r='37.097' fill='%233A86FF'/><circle cx='50' cy='50' r='35.484' fill='%2396CEB4'/><circle cx='50' cy='50' r='33.871' fill='%23AF52DE'/><circle cx='50' cy='50' r='32.258' fill='%23FFEEAD'/><circle cx='50' cy='50' r='30.645' fill='%2305D550'/><circle cx='50' cy='50' r='29.032' fill='%2306D6A0'/><circle cx='50' cy='50' r='27.419' fill='%2338B000'/><circle cx='50' cy='50' r='25.806' fill='%2396CEB4'/><circle cx='50' cy='50' r='24.194' fill='%2306D6A0'/><circle cx='50' cy='50' r='22.581' fill='%2396CEB4'/><circle cx='50' cy='50' r='20.968' fill='%234361EE'/><circle cx='50' cy='50' r='19.355' fill='%23F15BB5'/><circle cx='50' cy='50' r='17.742' fill='%23FF2D55'/><circle cx='50' cy='50' r='16.129' fill='%23FB5607'/><circle cx='50' cy='50' r='14.516' fill='%239B5DE5'/><circle cx='50' cy='50' r='12.903' fill='%2338B000'/><circle cx='50' cy='50' r='11.290' fill='%232A9D8F'/><circle cx='50' cy='50' r='9.677' fill='%2306D6A0'/><circle cx='50' cy='50' r='8.065' fill='%23E76F51'/><circle cx='50' cy='50' r='6.452' fill='%2330B0C7'/><circle cx='50' cy='50' r='4.839' fill='%234ECDC4'/><circle cx='50' cy='50' r='3.226' fill='%2305D550'/><circle cx='50' cy='50' r='1.613' fill='%2345B7D1'/></svg>">
	<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
	<div id="app-container">
		<div class="day-nav">
			<div id="hint" class="today-title">today is...</div>
		</div>
		<div id="circle-container">
			<div id="main-circle" class="circle-wrapper"></div>
		</div>
		<div id="bottom-container">
			<div id="done-button" class="day-link done-button">done!</div>
		</div>
	</div>

	<script>
		// 이 파일의 달: Jul 2026
		const FIXED_YEAR = 2026;
		const FIXED_MONTH = 6; // 0-indexed (Jan=0 ... Dec=11)

		function getDaysInMonth(year, month) {
			return new Date(year, month + 1, 0).getDate();
		}

		// 현재 실제 날짜와 비교해서 오늘 날짜로 시작할지 1일로 시작할지 결정
		const realNow = new Date();
		const isCurrentMonth = (realNow.getFullYear() === FIXED_YEAR && realNow.getMonth() === FIXED_MONTH);

		let currentYear = FIXED_YEAR;
		let currentMonth = FIXED_MONTH;
		let totalDays = getDaysInMonth(currentYear, currentMonth);
		// 주소 끝 #일자 로 시작일 지정 가능 (예: nov.html#1)
		const hashDay = parseInt(location.hash.slice(1), 10);
		let currentDay = (hashDay >= 1 && hashDay <= totalDays) ? hashDay : (isCurrentMonth ? realNow.getDate() : 1);

		// 알록달록 비비드 컬러 팔레트
		const vibrantColors = [
			'#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#00C7BE', '#30B0C7',
			'#007AFF', '#5856D6', '#AF52DE', '#FF2D55', '#FF6B6B', '#4ECDC4',
			'#45B7D1', '#96CEB4', '#FFEEAD', '#D4A5A5', '#9B5DE5', '#F15BB5',
			'#FEE440', '#00BBF9', '#00F5D4', '#E63946', '#F4A261', '#2A9D8F',
			'#E76F51', '#457B9D', '#F72585', '#7209B7', '#3A0CA3', '#4361EE',
			'#4CC9F0', '#06D6A0', '#118AB2', '#EF476F', '#FFD166', '#05D550',
			'#8338EC', '#3A86FF', '#FB5607', '#FF006E', '#38B000', '#70E000'
		];

		// Mulberry32 PRNG — 같은 연도/월이면 항상 동일한 색상 순서
		function mulberry32(a) {
			return function() {
				let t = a += 0x6D2B79F5;
				t = Math.imul(t ^ t >>> 15, t | 1);
				t ^= t + Math.imul(t ^ t >>> 7, t | 61);
				return ((t ^ t >>> 14) >>> 0) / 4294967296;
			};
		}

		// 1년 12달 색상 테이블 고정 생성 & localStorage 보존
		function getYearCalendarColors(year) {
			const storageKey = `calendar_year_colors_${year}`;
			try {
				const saved = localStorage.getItem(storageKey);
				if (saved) {
					const parsed = JSON.parse(saved);
					if (Array.isArray(parsed) && parsed.length === 12) return parsed;
				}
			} catch(e) {}

			const yearColors = [];
			for (let m = 0; m < 12; m++) {
				const days = getDaysInMonth(year, m);
				const seed = year * 10000 + (m + 1) * 37 + 1024;
				const rng = mulberry32(seed);
				const list = [];
				let last = '';
				for (let d = 0; d < days; d++) {
					let c;
					do { c = vibrantColors[Math.floor(rng() * vibrantColors.length)]; } while (c === last);
					list.push(c);
					last = c;
				}
				yearColors.push(list);
			}
			try { localStorage.setItem(storageKey, JSON.stringify(yearColors)); } catch(e) {}
			return yearColors;
		}

		let yearColors = getYearCalendarColors(currentYear);
		let colors = yearColors[currentMonth];

		// 숫자를 영어 단어로 (3 → three, 21 → twenty-one)
		function numberWord(n) {
			const ones = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
				'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
			const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
			if (n < 20) return ones[n];
			if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? '-' + ones[n % 10] : '');
			return numberWord(Math.floor(n / 100)) + ' hundred' + (n % 100 ? ' ' + numberWord(n % 100) : '');
		}

		// 실제 오늘과의 거리 → 한 줄 설명 (숫자 없이)
		function hintFor(dayNum) {
			const now = new Date();
			const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
			const target = new Date(currentYear, currentMonth, dayNum);
			const diff = Math.round((target - today) / 86400000);
			if (diff === 0) return 'today is...';
			if (diff === 1) return 'tomorrow is...';
			if (diff === 2) return 'the day after tomorrow is...';
			if (diff === -1) return 'yesterday was...';
			if (diff === -2) return 'the day before yesterday was...';
			return diff > 0
				? `${numberWord(diff)} days later is...`
				: `${numberWord(-diff)} days ago was...`;
		}

		const circleWrapper = document.getElementById('main-circle');
		const hint          = document.getElementById('hint');

		function render() {
			// 원 그리기
			circleWrapper.innerHTML = '';
			const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
			svg.setAttribute('viewBox', '0 0 1000 1000');
			svg.style.width = '100%';
			svg.style.height = '100%';

			const R = 500;
			const step = R / totalDays;
			for (let d = 1; d <= currentDay; d++) {
				const r = R - step * (d - 1);
				if (r <= 0) break;
				const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
				circle.setAttribute('cx', '500');
				circle.setAttribute('cy', '500');
				circle.setAttribute('r', r);
				circle.setAttribute('fill', colors[d - 1]);
				svg.appendChild(circle);
			}
			circleWrapper.appendChild(svg);

			// 위 한 줄: 오늘과의 거리
			hint.textContent = hintFor(currentDay);

			// 마지막 날까지 다 채우면 done! 노출
			document.getElementById('done-button').classList.toggle('visible', currentDay === totalDays);
		}

		// 원 클릭 → 다음 날짜 (마지막 날 다음은 1일로)
		document.getElementById('circle-container').addEventListener('click', () => {
			currentDay = currentDay < totalDays ? currentDay + 1 : 1;
			render();
		});

		const monthFiles = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

		// done! 색: 이 달 첫 원 색 / 호버 시 다음 달 첫 원 색
		const doneButton = document.getElementById('done-button');
		doneButton.style.setProperty('--done-color', yearColors[FIXED_MONTH][0]);
		doneButton.style.setProperty('--done-hover', yearColors[(FIXED_MONTH + 1) % 12][0]);

		// done! → 다음 달 1일을 새 탭으로
		doneButton.addEventListener('click', () => {
			window.open(`${monthFiles[(FIXED_MONTH + 1) % 12]}.html#1`, '_blank');
		});

		render();
	</script>
</body>
</html>
