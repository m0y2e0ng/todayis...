<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<title>Calendar Circle</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
	<div id="app-container">
		<div class="today-title">today is<span class="dots"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span></div>
		<div id="circle-container">
			<div id="main-circle" class="circle-wrapper"></div>
		</div>
		<div id="bottom-container">
			<div id="date-display" class="date-display"></div>
			<div id="next-month-wrapper" class="next-month-wrapper">
				<a id="next-month-link" class="next-month-link" href="#">
					<span class="arrow">-&gt;</span> <span id="next-month-name">Nov</span>
				</a>
			</div>
		</div>
	</div>

	<script>
		console.log('=== CALENDAR CIRCLE 2026 FIXED COLORS LOADED ===');
		// 1년(12달) 각 월별 일수 자동 계산
		function getDaysInMonth(year, month) {
			return new Date(year, month + 1, 0).getDate();
		}

		// URL 쿼리 파라미터가 있으면 해당 월/연도를 읽어옴 (예: ?m=11&y=2026)
		function getInitialDate() {
			const urlParams = new URLSearchParams(window.location.search);
			const paramMonth = urlParams.get('m');
			const paramYear = urlParams.get('y');
			const dNow = new Date();

			const y = paramYear ? parseInt(paramYear, 10) : dNow.getFullYear();
			const m = paramMonth ? (parseInt(paramMonth, 10) - 1) : dNow.getMonth();
			const isCurrentRealMonth = (y === dNow.getFullYear() && m === dNow.getMonth());
			const d = isCurrentRealMonth ? dNow.getDate() : 1;

			return { year: y, month: m, day: d };
		}

		let initial = getInitialDate();
		let currentYear = initial.year;
		let currentMonth = initial.month;
		let totalDays = getDaysInMonth(currentYear, currentMonth);
		let currentDay = initial.day;

		// 알록달록 감각적인 디자이너 비비드 컬러 팔레트
		const vibrantColors = [
			'#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#00C7BE', '#30B0C7',
			'#007AFF', '#5856D6', '#AF52DE', '#FF2D55', '#FF6B6B', '#4ECDC4',
			'#45B7D1', '#96CEB4', '#FFEEAD', '#D4A5A5', '#9B5DE5', '#F15BB5',
			'#FEE440', '#00BBF9', '#00F5D4', '#E63946', '#F4A261', '#2A9D8F',
			'#E76F51', '#457B9D', '#F72585', '#7209B7', '#3A0CA3', '#4361EE',
			'#4CC9F0', '#06D6A0', '#118AB2', '#EF476F', '#FFD166', '#05D550',
			'#8338EC', '#3A86FF', '#FB5607', '#FF006E', '#38B000', '#70E000'
		];

		// 결정론적 의사 난수 생성기 (Mulberry32) - 같은 연도/월이면 항상 동일한 색상 순서 유지
		function mulberry32(a) {
			return function() {
				let t = a += 0x6D2B79F5;
				t = Math.imul(t ^ t >>> 15, t | 1);
				t ^= t + Math.imul(t ^ t >>> 7, t | 61);
				return ((t ^ t >>> 14) >>> 0) / 4294967296;
			};
		}

		// 1년 12달(1월~12월) 각각의 일별 고유 색상 데이터 고정 생성 및 보존
		function getYearCalendarColors(year) {
			const storageKey = `calendar_year_colors_${year}`;
			try {
				const saved = localStorage.getItem(storageKey);
				if (saved) {
					const parsed = JSON.parse(saved);
					if (Array.isArray(parsed) && parsed.length === 12) {
						return parsed;
					}
				}
			} catch (e) {
				console.warn('localStorage error:', e);
			}

			// 1월부터 12월까지 각 월의 일수만큼 고유 색상 배정 (이웃 원끼리 색상 겹침 방지)
			const yearColors = [];
			for (let m = 0; m < 12; m++) {
				const days = getDaysInMonth(year, m);
				const seed = year * 10000 + (m + 1) * 37 + 1024;
				const rng = mulberry32(seed);
				const monthList = [];
				let lastColor = '';

				for (let d = 0; d < days; d++) {
					let chosen;
					do {
						chosen = vibrantColors[Math.floor(rng() * vibrantColors.length)];
					} while (chosen === lastColor);
					monthList.push(chosen);
					lastColor = chosen;
				}
				yearColors.push(monthList);
			}

			try {
				localStorage.setItem(storageKey, JSON.stringify(yearColors));
			} catch (e) {
				console.warn('localStorage error:', e);
			}

			return yearColors;
		}

		// 1년치 색상 테이블 로드 & 현재 월의 고정 색상 세트 가져오기
		let yearColors = getYearCalendarColors(currentYear);
		let colors = yearColors[currentMonth];

		const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
		const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

		// 다음 달 정보 계산 (12월인 경우 다음 해 1월로 계산)
		function getNextMonthInfo(year, month) {
			let nextY = year;
			let nextM = month + 1;
			if (nextM > 11) {
				nextM = 0;
				nextY++;
			}
			return { year: nextY, month: nextM, name: months[nextM] };
		}

		// "Thu, Oct 22" 포맷 날짜 생성
		function formatDate(dayNum) {
			const targetDate = new Date(currentYear, currentMonth, dayNum);
			const w = weekdays[targetDate.getDay()];
			const m = months[currentMonth];
			return `${w}, ${m} ${dayNum}`;
		}

		const circleWrapper = document.getElementById('main-circle');
		const dateDisplay = document.getElementById('date-display');
		const nextMonthWrapper = document.getElementById('next-month-wrapper');
		const nextMonthLink = document.getElementById('next-month-link');
		const nextMonthName = document.getElementById('next-month-name');

		function render() {
			// 1. 원 렌더링
			circleWrapper.innerHTML = '';
			const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
			svg.setAttribute('viewBox', '0 0 1000 1000');
			svg.style.width = '100%';
			svg.style.height = '100%';

			const R = 500;
			const step = R / totalDays;

			for (let d = 1; d <= currentDay; d++) {
				const r = R - step * (d - 1);
				if (r <= 0) break;

				const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
				circle.setAttribute('cx', '500');
				circle.setAttribute('cy', '500');
				circle.setAttribute('r', r);
				circle.setAttribute('fill', colors[d - 1]);

				svg.appendChild(circle);
			}

			circleWrapper.appendChild(svg);

			// 2. 하단 날짜 텍스트 갱신 ("Thu, Oct 22")
			dateDisplay.textContent = formatDate(currentDay);

			// 3. 마지막 날일 때 -> (다음달 영어 약자) 링크 노출 및 설정
			const nextInfo = getNextMonthInfo(currentYear, currentMonth);
			nextMonthName.textContent = nextInfo.name;
			nextMonthLink.href = `?m=${nextInfo.month + 1}&y=${nextInfo.year}`;

			if (currentDay === totalDays) {
				nextMonthWrapper.classList.add('visible');
			} else {
				nextMonthWrapper.classList.remove('visible');
			}
		}

		// 다음 달로 이동하는 함수
		function goToNextMonth() {
			const nextInfo = getNextMonthInfo(currentYear, currentMonth);
			currentYear = nextInfo.year;
			currentMonth = nextInfo.month;
			totalDays = getDaysInMonth(currentYear, currentMonth);
			currentDay = 1; // 다음 달 1일로 시작
			
			// 새 연도인 경우 색상 테이블 갱신
			yearColors = getYearCalendarColors(currentYear);
			colors = yearColors[currentMonth];

			// 브라우저 주소창 URL 업데이트 (실제 웹페이지 이동처럼 동작)
			const newUrl = `?m=${currentMonth + 1}&y=${currentYear}`;
			window.history.pushState({ year: currentYear, month: currentMonth }, '', newUrl);

			render();
		}

		// 다음 달 링크 클릭 시 부드러운 페이지 전환 처리
		nextMonthLink.addEventListener('click', (e) => {
			e.preventDefault();
			goToNextMonth();
		});

		// 원 터치/클릭 시 다음 날짜로 진행
		const container = document.getElementById('circle-container');
		container.addEventListener('click', () => {
			if (currentDay < totalDays) {
				currentDay++;
			} else {
				currentDay = 1; // 마지막 날 이후 다시 1일로 순환
			}
			render();
		});

		// 하단 날짜 텍스트 클릭 시 오늘 실제 날짜로 복귀
		dateDisplay.style.cursor = 'pointer';
		dateDisplay.addEventListener('click', () => {
			const realNow = new Date();
			currentYear = realNow.getFullYear();
			currentMonth = realNow.getMonth();
			totalDays = getDaysInMonth(currentYear, currentMonth);
			currentDay = realNow.getDate();
			yearColors = getYearCalendarColors(currentYear);
			colors = yearColors[currentMonth];
			window.history.pushState(null, '', window.location.pathname);
			render();
		});

		// 브라우저 뒤로가기/앞으로가기 지원
		window.addEventListener('popstate', () => {
			const cur = getInitialDate();
			currentYear = cur.year;
			currentMonth = cur.month;
			totalDays = getDaysInMonth(currentYear, currentMonth);
			currentDay = cur.day;
			yearColors = getYearCalendarColors(currentYear);
			colors = yearColors[currentMonth];
			render();
		});

		// 날짜/월 변경 자동 감지
		function checkDateChange() {
			const checkNow = new Date();
			const checkYear = checkNow.getFullYear();
			const checkMonth = checkNow.getMonth();
			
			// URL 파라미터가 없는 기본 오늘 뷰일 때만 자동 갱신
			const urlParams = new URLSearchParams(window.location.search);
			if (!urlParams.get('m')) {
				if (checkYear !== currentYear || checkMonth !== currentMonth) {
					currentYear = checkYear;
					currentMonth = checkMonth;
					totalDays = getDaysInMonth(currentYear, currentMonth);
					currentDay = checkNow.getDate();
					yearColors = getYearCalendarColors(currentYear);
					colors = yearColors[currentMonth];
					render();
				}
			}
		}

		setInterval(checkDateChange, 60000);
		window.addEventListener('focus', checkDateChange);
		document.addEventListener('visibilitychange', () => {
			if (!document.hidden) checkDateChange();
		});

		render();
	</script>
</body>
</html>
